<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0a08" id="themecolor">
<meta name="description" content="iAtmosfera — a IA que executa dentro do seu sistema de gestão. Em breve.">
<title>iAtmosfera — em breve</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f25f4c'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='-apple-system,Segoe UI,Inter,sans-serif' font-weight='800' font-size='34' fill='%23fff'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — identidade iAtmosfera (claro por padrão do design system,
   escuro como padrão desta página de "em breve"; o visitante escolhe)
   ============================================================ */
:root{
  --bg:#ffffff; --panel:#ffffff; --soft:#fbf6f4; --soft2:#fdf1ee; --line:#efe2dc; --line2:#e6d2ca;
  --coral:#f25f4c; --coral-l:#ff8b6b; --coral-d:#d8402c;
  --ink:#241713; --ink2:#3a2a24; --muted:#7a6259; --dim:#8a7168; --glow:rgba(242,95,76,.28); --ok:#3f7d5a; --err:#b5301e;
  --grad:linear-gradient(158deg,#f56a54,#f25f4c,#d8402c);
  --sys:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --glass:rgba(255,255,255,.72); --glassline:var(--line2); --glassshadow:0 24px 60px -20px rgba(120,60,40,.35);
  --pillbg:rgba(255,255,255,.7);
  --boardbg:rgba(255,252,250,.88); --scrim:rgba(255,250,248,.28); --glass2:rgba(255,253,252,.76);
  --ease:cubic-bezier(.2,.7,.3,1); --ease2:cubic-bezier(.7,0,.2,1);
}
body.dark{
  --bg:#0e0a08; --panel:#1a120f; --soft:#1c1310; --soft2:#2a1a15; --line:#2a1a15; --line2:#3a251e;
  --ink:#f4ede9; --ink2:#e8d9d2; --muted:#b79c92; --dim:#9a8076; --coral-d:#ff7a5f; --glow:rgba(242,95,76,.4); --ok:#8fc7a6; --err:#ff8b6b;
  --glass:rgba(28,20,17,.62); --glassline:rgba(255,139,107,.18); --glassshadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
  --pillbg:rgba(28,20,17,.55);
  --boardbg:rgba(14,10,8,.86); --scrim:rgba(8,5,4,.38); --glass2:rgba(26,18,15,.76);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{color:var(--ink);font-family:'Sora',var(--sys);font-weight:300;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 560px at 82% -12%,#ffe7df80,transparent 60%),radial-gradient(820px 460px at -12% 108%,#ffeae380,transparent 55%),var(--bg);
  transition:background .4s,color .4s}
body.dark{background:radial-gradient(1100px 560px at 82% -12%,#2a1a1566,transparent 60%),radial-gradient(820px 460px at -12% 108%,#2a121566,transparent 55%),var(--bg)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral-l);outline-offset:3px;border-radius:6px}
.srx{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   PALCO — duas telas empilhadas: 1) a rede/sistema  2) o quadro
   O quadro abre ABAIXO: o palco desliza para cima; a rede não sai do lugar.
   ============================================================ */
.stage{position:fixed;left:0;top:0;width:100%;height:100%}
.screen{position:relative;width:100%;height:100%}
#s1{overflow:hidden;transition:opacity .7s}
body.board #s1{opacity:.62} /* a galáxia continua ao fundo, um pouco esmaecida, enquanto a janela está aberta */
body.board .hero.on,body.board .hint.on,body.board .legend.on,body.board .back.on{opacity:0;transition:opacity .35s} /* textos da capa somem para não competir com a leitura */
#net{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#net.hand{cursor:pointer}
#net.grab{cursor:grabbing}

/* ---- marca no centro (o "sol"): grafia oficial, "i" coral ---- */
.cword{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;cursor:pointer;user-select:none;
  font-family:var(--sys);font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--ink);white-space:nowrap;
  font-size:clamp(58px,9.5vw,112px);opacity:0;animation:cwin 1.2s ease .2s forwards;
  transition:font-size 1.1s var(--ease2),left 1s var(--ease2),top 1s var(--ease2),transform 1s var(--ease2),text-shadow 1s,opacity .5s;
  text-shadow:0 0 60px rgba(242,95,76,.35)}
@keyframes cwin{to{opacity:1}}
.cword .i{color:var(--coral)}
.cword::after{content:'';position:absolute;left:0;right:0;bottom:-.18em;height:2px;background:var(--grad);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:cwline .9s var(--ease) .9s forwards}
@keyframes cwline{to{transform:scaleX(1)}}
.cword.small{font-size:clamp(26px,3vw,38px);text-shadow:0 0 28px rgba(242,95,76,.3);left:var(--cx,50%);top:var(--cy,50%)}
.cword.small::after{animation:none;transform:scaleX(0)}
.cword.hide{opacity:0!important;pointer-events:none;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
/* título do sistema aberto (quando um nó vira o centro) */
.ctitle{position:absolute;left:var(--cx,50%);top:var(--cy,50%);transform:translate(-50%,-50%) scale(.6);z-index:6;text-align:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,transform .4s var(--ease),visibility 0s .3s}
.ctitle.on{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);pointer-events:auto;transition:opacity .6s .5s,transform .8s var(--ease) .5s,visibility 0s}
.ctitle h1{font-family:var(--sys);font-weight:700;font-size:clamp(24px,3vw,36px);letter-spacing:-.025em;line-height:1.05;color:var(--ink);white-space:nowrap;cursor:pointer}
.ctitle .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}

/* ---- hero: "em breve" + frase (topo, fora das órbitas) ---- */
.hero{position:absolute;left:50%;top:clamp(26px,4vh,44px);transform:translateX(-50%);z-index:5;width:min(720px,calc(100vw - 40px));text-align:center;opacity:0;transition:opacity .9s .2s;pointer-events:none}
.hero.on{opacity:1}
.kick{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--coral-d);border:1px solid rgba(242,95,76,.4);background:var(--pillbg);padding:6px 13px 6px 10px;border-radius:100px;backdrop-filter:blur(10px)}
.kick i{width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 0 rgba(242,95,76,.55);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,95,76,.55)}100%{box-shadow:0 0 0 12px rgba(242,95,76,0)}}
.phrase{position:relative;height:2.6em;margin-top:10px;font-family:var(--sys);font-weight:600;font-size:clamp(17px,2vw,24px);letter-spacing:-.02em;line-height:1.3;color:var(--ink)}
.phrase span{position:absolute;left:0;right:0;top:0;opacity:0;transform:translateY(6px);transition:opacity .45s,transform .6s var(--ease)}
.phrase span.on{opacity:1;transform:none}
.phrase b{font-weight:600;color:var(--coral-d)}

/* ---- rodapé da tela 1: legenda + dica ---- */
.legend{position:absolute;left:max(30px,env(safe-area-inset-left));bottom:30px;z-index:5;display:flex;flex-direction:column;gap:9px;opacity:0;transition:opacity .6s;font-size:12px;color:var(--muted);pointer-events:none}
.legend.on{opacity:1}
.legend div{display:flex;align-items:center;gap:9px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.legend .a{background:var(--grad)} .legend .p{border:1.5px solid var(--coral);background:var(--bg)}
.back{position:absolute;left:max(30px,env(safe-area-inset-left));bottom:22px;height:38px;z-index:7;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s,border-color .2s,color .2s,transform .2s,visibility 0s .5s}
.back.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .5s,border-color .2s,color .2s,transform .2s,visibility 0s}
.hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:5;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);opacity:0;transition:opacity .8s;pointer-events:none;white-space:nowrap}
.hint.on{opacity:1}
.hint.off{opacity:0}

/* ============================================================
   SISTEMA DE BOTÕES — uma família só de pílulas
   .btn (primário, gradiente) · .btn.ghost (vidro, contorno) · .btn.sm · .chip · .iconbtn
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:42px;padding:0 20px;border-radius:100px;border:1px solid transparent;
  background:var(--grad);color:#fff;text-decoration:none;font-size:13.5px;font-weight:600;letter-spacing:-.005em;cursor:pointer;white-space:nowrap;
  box-shadow:0 8px 22px -10px rgba(242,95,76,.55);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px -10px rgba(242,95,76,.6)}
.btn:active{transform:translateY(0)}
.btn svg{width:16px;height:16px;flex:none}
.btn.ghost{background:var(--pillbg);color:var(--ink);border-color:var(--line2);box-shadow:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn.ghost:hover{border-color:var(--coral);color:var(--ink);box-shadow:0 10px 26px -14px rgba(120,60,40,.5)}
.btn.ghost svg{color:var(--coral-d)}
.btn.sm{height:36px;padding:0 15px;font-size:12.5px}
.btn.lg{height:48px;padding:0 26px;font-size:14.5px}
.btn[disabled]{opacity:.6;cursor:default;transform:none!important}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:100px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:12.5px;font-weight:400;cursor:pointer;transition:border-color .2s,color .2s,background .2s,transform .2s;text-align:left}
.chip:hover{border-color:var(--coral);color:var(--ink);background:rgba(242,95,76,.08);transform:translateY(-1px)}
.chip.go{border-color:rgba(242,95,76,.4);color:var(--coral-d)}
.chip.go::after{content:'›';font-weight:600;margin-left:1px}
.chip.cta{background:rgba(242,95,76,.1);border-color:rgba(242,95,76,.35);color:var(--coral-d);font-weight:500}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--pillbg);color:var(--muted);cursor:pointer;transition:border-color .2s,color .2s,background .2s,transform .2s;backdrop-filter:blur(12px)}
.iconbtn:hover{border-color:var(--coral);color:var(--ink);transform:translateY(-1px)}
.iconbtn svg{width:16px;height:16px}

/* ---- barra superior (fixa, nas duas telas) ---- */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:20px max(30px,env(safe-area-inset-right)) 20px max(30px,env(safe-area-inset-left));opacity:0;transition:opacity .9s,background .3s;pointer-events:none;
  padding-top:max(20px,env(safe-area-inset-top))}
.top.on{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;color:inherit;background:none;border:0;padding:4px;border-radius:14px}
.brand .word{font-family:var(--sys);font-weight:700;font-size:17px;letter-spacing:-.02em;color:var(--ink);opacity:0;transform:translateX(-6px);transition:opacity .5s,transform .5s}
.brand .word .i{color:var(--coral)}
body.corner .brand .word{opacity:1;transform:none}
.crumb{display:flex;align-items:center;gap:9px;font-family:var(--sys);font-weight:600;font-size:14px;color:var(--muted);opacity:0;transition:opacity .2s;pointer-events:none}
.crumb.on{opacity:1;transition:opacity .5s .4s}
.crumb .sep{color:var(--dim);font-weight:400}
.actions{display:flex;align-items:center;gap:10px}

/* ---- ícone oficial (bloco .logomark do template, escalado via --s) ---- */
.logomark{--s:.1682;position:relative;width:calc(214px * var(--s));height:calc(214px * var(--s));flex:none}
.logomark .plate{position:absolute;top:0;left:0;width:214px;height:214px;transform-origin:top left;transform:scale(var(--s));display:flex;align-items:center;justify-content:center}
.logomark .plate .face{position:absolute;inset:0;border-radius:48px;background:linear-gradient(158deg,#f56a54 0%,#f25f4c 45%,#d8402c 100%);box-shadow:0 24px 60px rgba(216,64,44,.42),inset 0 2px 0 rgba(255,255,255,.18)}
.logomark .plate .ring{position:absolute;width:158px;height:158px;border-radius:50%;border:2px solid rgba(255,255,255,.38);border-right-color:transparent;border-top-color:transparent;animation:v4spin 16s linear infinite}
.logomark .plate .ring .dot{position:absolute;bottom:4px;left:4px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.85)}
.logomark .plate .mono{position:relative;display:block;font-family:var(--sys);font-weight:800;font-size:106px;line-height:1;letter-spacing:-.05em;color:#fff;text-shadow:0 2px 10px rgba(120,20,10,.35)}
@keyframes v4spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ---- botão de tema ---- */
.themebtn{position:fixed;bottom:22px;right:max(22px,env(safe-area-inset-right));z-index:60;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:600 12.5px/1 var(--sys);color:var(--muted);background:var(--pillbg);border:1px solid var(--line2);border-radius:999px;height:38px;padding:0 15px;backdrop-filter:blur(12px);box-shadow:0 10px 26px -12px rgba(120,60,40,.5);transition:border-color .18s ease,transform .18s ease,opacity .9s;opacity:0;pointer-events:none;
  bottom:max(22px,env(safe-area-inset-bottom))}
.themebtn.on{opacity:1;pointer-events:auto}
.themebtn:hover{border-color:var(--coral);transform:translateY(-2px)}
.themebtn svg{width:15px;height:15px;color:var(--coral-d)}
.themebtn .ic-sun,.themebtn .lbl-light{display:none}
body.dark .themebtn .ic-moon,body.dark .themebtn .lbl-dark{display:none}
body.dark .themebtn .ic-sun,body.dark .themebtn .lbl-light{display:inline-flex}


/* ============================================================
   TELA 2 — O QUADRO (abre abaixo da rede)
   ============================================================ */
#s2{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:96px 32px 30px;background:var(--scrim);visibility:hidden;opacity:0;transition:opacity .35s,visibility 0s .45s}
#s2.open{visibility:visible;opacity:1;transition:opacity .3s,visibility 0s}
/* a janela: translúcida, com margens, nasce do nó clicado (transform-origin) e volta para ele ao fechar */
.panel{position:relative;width:min(1180px,100%);max-height:100%;overflow:auto;overscroll-behavior:contain;border-radius:30px;background:var(--glass2);border:1px solid var(--glassline);box-shadow:var(--glassshadow);
  transform-origin:var(--px,50%) var(--py,50%);transform:scale(.12);opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .28s}
#s2.open .panel.in{transform:none;opacity:1}
.panel.settled{backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}
.panel::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(700px 320px at 50% -8%,rgba(242,95,76,.12),transparent 65%)}
@media(prefers-reduced-motion:reduce){.panel,#s2{transition:none}}
.bwrap{position:relative;max-width:1140px;margin:0 auto;display:flex;flex-direction:column;padding:30px 40px 28px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.bhead .left{display:flex;align-items:center;gap:12px}
.bpath{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.bpath .sep{color:var(--dim)}
.bpath .bm{font-family:var(--sys);font-weight:600;color:var(--ink)}
.bpath .bm .i{color:var(--coral)}
.bpath .dot{width:9px;height:9px;border-radius:50%;background:var(--grad);flex:none}
.bpath .dot.p{background:var(--bg);border:1.5px solid var(--coral)}
.bgrid{display:grid;grid-template-columns:1.12fr .88fr;gap:44px;align-items:center;flex:1;padding:8px 0 4px}
.btext{opacity:0;transform:translateY(14px);transition:opacity .6s .35s,transform .6s var(--ease) .35s}
.bmedia{opacity:0;transform:translateY(18px) scale(.98);transition:opacity .6s .5s,transform .7s var(--ease) .5s}
#s2.open .btext,#s2.open .bmedia{opacity:1;transform:none}
.bk{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bk .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.bk .st{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);border:1px solid var(--line2);background:var(--pillbg);padding:4px 11px;border-radius:100px}
.bk .st.live{color:var(--coral-d);border-color:rgba(242,95,76,.45)}
.btext h2{font-family:var(--sys);font-weight:700;font-size:clamp(26px,3.2vw,40px);letter-spacing:-.03em;line-height:1.08;color:var(--ink);margin-bottom:18px}
.btext h2 .i{color:var(--coral)}
.say{font-size:clamp(15px,1.25vw,17.5px);line-height:1.7;color:var(--ink2);min-height:3.4em;max-width:56ch}
.say .i{color:var(--coral)}
.say .cur{display:inline-block;width:7px;height:1em;background:var(--coral);vertical-align:-2px;margin-left:2px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.say p+p{margin-top:.8em}
.extra{margin-top:18px;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.extra.on{opacity:1;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.bfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.bfoot .nav{display:flex;gap:8px}
.bfoot .note{font-size:12px;color:var(--dim)}

/* ---- slot de mídia (animação do nó) ---- */
.media{position:relative;aspect-ratio:16/10;border-radius:26px;overflow:hidden;background:var(--glass);border:1px solid var(--glassline);box-shadow:var(--glassshadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.media>*{position:absolute;inset:0;width:100%;height:100%}
.media img,.media video{object-fit:cover;display:block}
.media .lottie{display:block}
.media .tag{position:absolute;left:14px;bottom:12px;top:auto;width:auto;height:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);background:var(--pillbg);border:1px solid var(--line2);padding:4px 9px;border-radius:100px}
/* animação padrão: planeta com órbitas (quando o nó ainda não tem mídia) */
.orbitz{display:block}
.orbitz .ring{fill:none;stroke:var(--coral);stroke-opacity:.35;stroke-width:1;stroke-dasharray:3 5}
.orbitz .ring2{fill:none;stroke:var(--line2);stroke-width:1}
.orbitz .moon{fill:var(--coral-l)}
.orbitz .moon2{fill:var(--bg);stroke:var(--coral);stroke-width:1.5}
.orbitz .halo{fill:url(#halo)}
.orbitz .r1{animation:spin 18s linear infinite;transform-origin:150px 112px}
.orbitz .r2{animation:spin 30s linear infinite reverse;transform-origin:150px 112px}
.orbitz .rs{animation:spin 9s linear infinite;transform-origin:150px 112px}
@keyframes spin{to{transform:rotate(360deg)}}
.orbitz .star{fill:var(--ink);opacity:.18}
.orbitz .lbl{font-family:var(--sys);font-weight:800;font-size:30px;fill:#fff;letter-spacing:-.05em}

/* ---- formulário "avise-me" ---- */
.form{display:grid;gap:10px;margin-top:22px;max-width:520px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.field input,.field select{height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font-size:14px;transition:border-color .2s,box-shadow .2s;appearance:none;-webkit-appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 20px) 19px,calc(100% - 15px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.field input:focus,.field select:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px rgba(242,95,76,.15)}
.form .hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.form .send{display:flex;align-items:center;gap:12px;margin-top:4px;flex-wrap:wrap}
.form .msg{font-size:13px;color:var(--muted)}
.form .msg.ok{color:var(--ok)}
.form .msg.err{color:var(--err)}
.field input[aria-invalid=true]{border-color:var(--err)}
.form .pv{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---- navegação acessível (teclado/leitor de tela) ---- */
.a11y{position:absolute;left:30px;top:96px;z-index:8;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none}
.a11y button{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;background:none}
.a11y button:focus-visible{position:static;width:auto;height:auto;clip:auto;pointer-events:auto;padding:6px 10px;border-radius:100px;background:var(--pillbg);color:var(--ink);font-size:12px;border:1px solid var(--coral)}

   RESPONSIVO
   ============================================================ */
@media(max-width:900px){
  .bgrid{grid-template-columns:1fr;gap:26px;align-items:start}

}

  .a11y{left:16px;top:80px}
  body.board .themebtn{opacity:0;pointer-events:none}
  body.corner .hint{display:none}
  .btn{height:38px;padding:0 15px;font-size:12.5px}
  .themebtn{height:36px;width:36px;padding:0;justify-content:center;right:max(14px,env(safe-area-inset-right))}
  .themebtn .lbl-dark,.themebtn .lbl-light{display:none!important}
  #s2{padding:70px 10px 12px}
  .panel{border-radius:22px}

  .cword{font-size:clamp(44px,13vw,64px)}
  .cword.small{font-size:20px}
  .ctitle h1{font-size:20px;white-space:normal;max-width:60vw}
  .hero{top:64px;width:calc(100vw - 32px)}
  .phrase{font-size:16px;height:3em}
  .legend{display:none}
  .back{left:max(14px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom))}

  .brand .word{display:none}

  .say{font-size:15px}
  .bfoot{flex-direction:column;align-items:stretch}

  .form .row{grid-template-columns:1fr}
}
@media(max-height:520px){
  .hero,.legend{display:none}
  .cword.small{font-size:20px}
  .hint{bottom:14px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important}
  .cword{opacity:1;transition:none}
  .stage{transition:none}

  debug: () => ({ W, H, cx, cy, compact, mobile, sys, boardOpen, progress: +progress.toFixed(2), rings: rings.filter(r => !r.belt).map(r => ({ id: r.id, R: Math.round(r.R), ry: Math.round(r.R * Math.sin(r.phi)) })), nodes: nodes.map(n => ({ id: n.id, x: Math.round(n.x), y: Math.round(n.y), d: Math.round(n.d) })), wr: [Math.round(WRX), Math.round(WRY)] }),
  open: id => { const n = nodes.find(x => x.id === id); if (n) activate(n); else if (N[id]) nav('n/' + id); },
  enter: id => { if (P[id]) nav('s/' + id); },
  openIntro: () => nav(introHash()), openAvise: () => nav('avise'), close: closeTo,
  firstNodeId: which => { const rs = rings.filter(r => !r.belt); const r = which === 'outer' ? rs[rs.length - 1] : rs[0]; const n = nodes.find(x => x.ring === r); return n ? n.id : null; },
  nodeScreenPos: id => { const n = nodes.find(x => x.id === id); return n ? { x: n.x, y: n.y } : null; },
};
